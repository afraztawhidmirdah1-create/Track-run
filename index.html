<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lane Dash</title>
<style>
  :root{
    --sky1:#7ec8f2; --sky2:#bfe8ff; --track:#3a3f4b; --lane-line:#f2c14e;
    --player:#ff5d5d; --coin:#ffd54a; --obstacle:#4a4e57; --obstacle2:#8b2e2e;
    --ui-bg: rgba(20,24,32,0.65); --ui-text:#fff;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --ui-bg: rgba(10,12,18,0.75); }
  }
  html,body{ height:100%; margin:0; overflow:hidden; background:#000; }
  body{
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    display:flex; align-items:center; justify-content:center;
  }
  #wrap{
    position:relative; width:100%; height:100%;
    max-width:480px; margin:0 auto;
    background: linear-gradient(var(--sky1), var(--sky2));
  }
  canvas{ display:block; width:100%; height:100%; touch-action:none; }
  #hud{
    position:absolute; top:0; left:0; right:0;
    padding: calc(env(safe-area-inset-top,0px) + 10px) 14px 8px;
    display:flex; justify-content:space-between; align-items:center;
    color:var(--ui-text); font-weight:700; font-size:18px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.4);
    pointer-events:none;
  }
  #overlay{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    background: rgba(10,14,20,0.55); color:#fff; padding:20px;
  }
  #overlay h1{ font-size:28px; margin:0 0 6px; }
  #overlay p{ margin:4px 0 18px; opacity:0.9; font-size:14px; }
  #overlay button{
    background: var(--coin); color:#3a2a00; border:none; border-radius:12px;
    padding:14px 32px; font-size:18px; font-weight:800; cursor:pointer;
  }
  #overlay button.secondary{
    background: rgba(255,255,255,0.18); color:#fff; margin-top:10px;
  }
  .credit{ font-size:13px; opacity:0.85; margin-top:-4px; margin-bottom:22px; letter-spacing:0.3px; }
  .menu-btns{ display:flex; flex-direction:column; gap:12px; width:220px; }
  .hint{ max-width:260px; font-size:12px; margin-top:18px; }
  .vault-grid{
    display:grid; grid-template-columns:repeat(3,1fr); gap:14px;
    margin:10px 0 20px; max-width:320px;
  }
  .char-card{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    padding:8px 4px; border-radius:12px; border:2px solid transparent;
    background: rgba(255,255,255,0.08); cursor:pointer;
  }
  .char-card.selected{ border-color: var(--coin); background: rgba(255,213,74,0.18); }
  .char-name{ font-size:12px; font-weight:700; }
  .hidden{ display:none !important; }
  #score-final{ font-size:40px; font-weight:900; margin:6px 0 2px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud">
    <div id="scoreLabel">Score: 0</div>
    <div id="bestLabel">Best: 0</div>
  </div>
  <div id="overlay"></div>
</div>
<script>
(function(){
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const wrap = document.getElementById('wrap');
  const overlay = document.getElementById('overlay');
  const scoreLabel = document.getElementById('scoreLabel');
  const bestLabel = document.getElementById('bestLabel');

  let W, H, groundY, laneW;
  const LANES = 3;
  let best = 0;
  try{ best = parseInt(localStorage.getItem('lanedash_best')||'0',10) || 0; }catch(e){}
  bestLabel.textContent = 'Best: ' + best;

  const CHARACTERS = [
    { name:'Rusty',  shirt:'#ff5d5d', shirtDark:'#c93f3f', pants:'#3d434d', skin:'#ffd8b0', hair:'#8a3b1e' },
    { name:'Jazz',   shirt:'#4fc0ff', shirtDark:'#2e8fc9', pants:'#2b2f36', skin:'#e8b48a', hair:'#1c1c1c' },
    { name:'Coral',  shirt:'#ff8fd6', shirtDark:'#d451a8', pants:'#4a3a5c', skin:'#fff0dd', hair:'#e0c14a' },
    { name:'Slate',  shirt:'#8f9aa8', shirtDark:'#5d6772', pants:'#22262d', skin:'#c88a5a', hair:'#2a2a2a' },
    { name:'Mango',  shirt:'#ffb03b', shirtDark:'#d98a1a', pants:'#3d2b1d', skin:'#ffd8b0', hair:'#4a2e1a' },
    { name:'Mint',   shirt:'#4fe0a8', shirtDark:'#2ba57a', pants:'#1f3d33', skin:'#f2c99a', hair:'#0f1f1a' }
  ];
  let selectedChar = 0;
  try{ selectedChar = parseInt(localStorage.getItem('lanedash_char')||'0',10) || 0; }catch(e){}
  if (selectedChar<0 || selectedChar>=CHARACTERS.length) selectedChar = 0;

  let horizonY;
  function resize(){
    W = wrap.clientWidth; H = wrap.clientHeight;
    canvas.width = W; canvas.height = H;
    groundY = H * 0.78;
    horizonY = H * 0.30;
    laneW = W / LANES;
  }
  window.addEventListener('resize', resize);
  resize();

  function laneX(i){ return laneW * i + laneW/2; }
  // perspective: road narrows toward horizon like a converging track
  function roadWidthAt(t){ return W*0.22 + (W - W*0.22) * t; } // t: 0 at horizon, 1 at ground
  function laneXAt(t, i){
    const rw = roadWidthAt(t);
    return W/2 + (i - 1) * (rw / LANES);
  }

  let state = 'menu'; // menu, playing, dead
  let player, obstacles, coins, particles, speed, distance, score, spawnTimer, coinTimer, groundOffset;

  function reset(){
    player = {
      lane: 1, x: laneX(1),
      y: 0, vy: 0,
      w: Math.min(56, laneW*0.55), h: 70,
      state: 'run', // run, jump, slide
      slideTimer: 0,
      runFrame: 0
    };
    obstacles = [];
    coins = [];
    particles = [];
    speed = 6.2;
    distance = 0;
    score = 0;
    spawnTimer = 0;
    coinTimer = 0;
    groundOffset = 0;
  }

  function startGame(){
    reset();
    state = 'playing';
    overlay.classList.add('hidden');
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  function renderHome(){
    state = 'menu';
    overlay.innerHTML =
      '<h1>Lane Dash</h1>' +
      '<p class="credit">Made by Afraz Studio</p>' +
      '<div class="menu-btns">' +
        '<button id="playBtn">▶ Play</button>' +
        '<button id="shopBtn" class="secondary">🛍 Shop</button>' +
      '</div>' +
      '<p class="hint">Swipe left/right to change lanes · up to jump · down to slide</p>';
    overlay.classList.remove('hidden');
    document.getElementById('playBtn').addEventListener('click', startGame);
    document.getElementById('shopBtn').addEventListener('click', renderShop);
  }

  function renderShop(){
    state = 'menu';
    const cards = CHARACTERS.map((c,i)=>
      '<div class="char-card' + (i===selectedChar?' selected':'') + '" data-i="' + i + '">' +
        '<canvas class="char-preview" width="70" height="90" data-i="' + i + '"></canvas>' +
        '<div class="char-name">' + c.name + '</div>' +
      '</div>'
    ).join('');
    overlay.innerHTML =
      '<h1>Shop</h1>' +
      '<p class="credit">Pick your runner</p>' +
      '<div class="vault-grid">' + cards + '</div>' +
      '<button id="backBtn" class="secondary">Back</button>';
    overlay.classList.remove('hidden');
    document.querySelectorAll('.char-preview').forEach(cv=>{
      drawCharPreview(cv.getContext('2d'), CHARACTERS[parseInt(cv.dataset.i)]);
    });
    document.querySelectorAll('.char-card').forEach(el=>{
      el.addEventListener('click', ()=>{
        selectedChar = parseInt(el.dataset.i);
        try{ localStorage.setItem('lanedash_char', String(selectedChar)); }catch(e){}
        renderShop();
      });
    });
    document.getElementById('backBtn').addEventListener('click', renderHome);
  }

  function gameOver(){
    state = 'dead';
    if (score > best){ best = score; try{ localStorage.setItem('lanedash_best', String(best)); }catch(e){} }
    bestLabel.textContent = 'Best: ' + best;
    overlay.innerHTML =
      '<h1>Wiped Out!</h1>' +
      '<div id="score-final">' + score + '</div>' +
      '<p>Best: ' + best + '</p>' +
      '<div class="menu-btns">' +
        '<button id="retryBtn">Run Again</button>' +
        '<button id="homeBtn" class="secondary">Home</button>' +
      '</div>';
    overlay.classList.remove('hidden');
    document.getElementById('retryBtn').addEventListener('click', startGame, {once:true});
    document.getElementById('homeBtn').addEventListener('click', renderHome, {once:true});
  }

  // --- input ---
  let touchStartX=0, touchStartY=0, touchActive=false;
  function onDown(x,y){ touchStartX=x; touchStartY=y; touchActive=true; }
  function onUp(x,y){
    if(!touchActive) return;
    touchActive=false;
    const dx = x - touchStartX, dy = y - touchStartY;
    const adx = Math.abs(dx), ady = Math.abs(dy);
    if (state!=='playing'){ return; }
    if (Math.max(adx,ady) < 18){ return; } // tap ignored
    if (adx > ady){
      if (dx > 0) changeLane(1); else changeLane(-1);
    } else {
      if (dy < 0) doJump(); else doSlide();
    }
  }
  canvas.addEventListener('touchstart', e=>{ const t=e.changedTouches[0]; onDown(t.clientX,t.clientY); }, {passive:true});
  canvas.addEventListener('touchend', e=>{ const t=e.changedTouches[0]; onUp(t.clientX,t.clientY); }, {passive:true});
  canvas.addEventListener('mousedown', e=> onDown(e.clientX,e.clientY));
  canvas.addEventListener('mouseup', e=> onUp(e.clientX,e.clientY));
  window.addEventListener('keydown', e=>{
    if (state!=='playing') return;
    if (e.key==='ArrowLeft') changeLane(-1);
    else if (e.key==='ArrowRight') changeLane(1);
    else if (e.key==='ArrowUp'|| e.key===' ') doJump();
    else if (e.key==='ArrowDown') doSlide();
  });

  function changeLane(dir){
    const nl = player.lane + dir;
    if (nl<0 || nl>=LANES) return;
    player.lane = nl;
  }
  function doJump(){
    if (player.state==='jump') return;
    if (player.state==='slide') { player.state='run'; player.slideTimer=0; }
    player.vy = -13.5;
    player.state = 'jump';
  }
  function doSlide(){
    if (player.state==='jump') return;
    player.state='slide';
    player.slideTimer = 0.5;
  }

  // --- entities ---
  const GRAVITY = 0.62;

  function spawnObstacle(){
    const lane = Math.floor(Math.random()*LANES);
    const type = Math.random() < 0.5 ? 'low' : 'high'; // low = jump over, high = slide under
    obstacles.push({ lane, z: 1200, type, passed:false });
  }
  function spawnCoinRow(){
    const lane = Math.floor(Math.random()*LANES);
    const count = 3 + Math.floor(Math.random()*3);
    for (let i=0;i<count;i++){
      coins.push({ lane, z: 1200 + i*70, taken:false });
    }
  }

  function project(z){
    // returns {scale, y, t} for perspective; z from ~1200 (far) to 0 (player)
    const t = Math.max(0, Math.min(1, 1 - z/1200));
    const eased = t*t; // ease-in so far objects shrink/converge faster, like real perspective
    const scale = 0.22 + eased*0.85;
    const y = horizonY + (groundY - horizonY) * eased;
    return {scale, y, t: eased};
  }

  let lastTime = 0;
  function loop(t){
    if (state!=='playing'){ return; }
    const dt = Math.min(0.033, (t-lastTime)/1000);
    lastTime = t;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  function update(dt){
    speed += dt*0.15; // gradually speed up
    distance += speed;
    score = Math.floor(distance/10);
    scoreLabel.textContent = 'Score: ' + score;
    groundOffset = (groundOffset + speed*2) % 80;

    // player vertical physics
    if (player.state==='jump'){
      player.vy += GRAVITY;
      player.y += player.vy;
      if (player.y >= 0){ player.y = 0; player.vy = 0; player.state='run'; }
    }
    if (player.state==='slide'){
      player.slideTimer -= dt;
      if (player.slideTimer<=0){ player.state='run'; }
    }
    player.runFrame += dt*10;

    // smooth lane x
    const targetX = laneX(player.lane);
    player.x += (targetX - player.x) * Math.min(1, dt*12);

    // spawn
    spawnTimer -= dt;
    if (spawnTimer<=0){
      spawnObstacle();
      spawnTimer = Math.max(0.55, 1.3 - speed*0.03);
    }
    coinTimer -= dt;
    if (coinTimer<=0){
      spawnCoinRow();
      coinTimer = 1.6;
    }

    // move obstacles/coins toward player
    const moveAmt = speed*7*dt*10*0.06 + speed*3*dt; // tuned speed
    for (const o of obstacles){ o.z -= speed*7*dt*10; }
    for (const c of coins){ c.z -= speed*7*dt*10; }
    obstacles = obstacles.filter(o=>o.z > -80);
    coins = coins.filter(c=>c.z > -80);

    // collisions - check when obstacle z near player zone
    for (const o of obstacles){
      if (o.passed) continue;
      if (o.z < 60 && o.z > -20 && o.lane===player.lane){
        const collide = (o.type==='low' && player.state!=='jump') ||
                         (o.type==='high' && player.state!=='slide');
        if (collide){
          o.passed = true;
          gameOver();
          return;
        } else {
          o.passed = true;
        }
      }
    }
    for (const c of coins){
      if (c.taken) continue;
      if (c.z < 60 && c.z > -20 && c.lane===player.lane){
        c.taken = true;
        score += 5;
        particles.push({x: player.x, y: groundY - 60, life: 0.4, txt:'+5'});
      }
    }
    for (const p of particles){ p.life -= dt; p.y -= dt*40; }
    particles = particles.filter(p=>p.life>0);
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    // sky
    const grd = ctx.createLinearGradient(0,0,0,groundY);
    grd.addColorStop(0, '#6ec3f4');
    grd.addColorStop(0.6, '#a9ddfb');
    grd.addColorStop(1, '#e8f6ff');
    ctx.fillStyle = grd;
    ctx.fillRect(0,0,W,horizonY+40);

    // sun glow
    ctx.save();
    const sunG = ctx.createRadialGradient(W*0.78,horizonY*0.5,4,W*0.78,horizonY*0.5,70);
    sunG.addColorStop(0,'rgba(255,250,210,0.95)');
    sunG.addColorStop(1,'rgba(255,250,210,0)');
    ctx.fillStyle = sunG;
    ctx.fillRect(0,0,W,horizonY+60);
    ctx.restore();

    // drifting clouds
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    const cloudDrift = (distance*0.05);
    for (let i=0;i<4;i++){
      const cx = ((i*W*0.7 - cloudDrift) % (W+160)) - 80;
      const cy = horizonY*0.35 + (i%2)*22;
      cloud(cx, cy, 26 + (i%3)*6);
    }

    // parallax city skyline (scrolls slowly opposite to give depth)
    const parX = -(distance*0.15) % (W*2);
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    for (let pass=0; pass<2; pass++){
      const offX = parX + pass*W*2;
      for (let i=0;i<8;i++){
        const bw = (W*2)/8;
        const bh = 30 + ((i*37)%50);
        ctx.fillRect(offX + i*bw, horizonY - bh, bw-8, bh);
      }
    }

    // rolling ground either side of the tracks, with grass texture + trees
    const grassGrd = ctx.createLinearGradient(0,horizonY,0,H);
    grassGrd.addColorStop(0, '#6ea355');
    grassGrd.addColorStop(1, '#3f6634');
    ctx.fillStyle = grassGrd;
    ctx.fillRect(0, horizonY, W, H-horizonY);

    // scattered trees along the trackside, scrolling with distance
    const treeShift = (distance*0.9) % 220;
    for (let i=-1;i<6;i++){
      const t = (i*220 - treeShift)/900;
      if (t<0 || t>1) continue;
      const y = horizonY + (groundY-horizonY)*t*t*0.9 + 6;
      const rw = roadWidthAt(t*t);
      const side = (i%2===0) ? -1 : 1;
      const tx = W/2 + side*(rw/2 + 26*(0.4+t));
      tree(tx, y, 10 + t*26);
    }

    // perspective road (trapezoid) with gradient for depth
    const topW = roadWidthAt(0), botW = roadWidthAt(1);
    const trackGrd = ctx.createLinearGradient(0,horizonY,0,groundY);
    trackGrd.addColorStop(0, '#54596a');
    trackGrd.addColorStop(1, '#2c2f38');
    ctx.fillStyle = trackGrd;
    ctx.beginPath();
    ctx.moveTo(W/2-topW/2, horizonY);
    ctx.lineTo(W/2+topW/2, horizonY);
    ctx.lineTo(W/2+botW/2, groundY);
    ctx.lineTo(W/2-botW/2, groundY);
    ctx.closePath();
    ctx.fill();

    // scrolling sleepers across the road for motion feel
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    const sleeperCount = 10;
    for (let i=0;i<sleeperCount;i++){
      let t = ((i/sleeperCount) + (groundOffset/80)/sleeperCount) % 1;
      const y = horizonY + (groundY-horizonY) * (t*t);
      const w = roadWidthAt(t*t) * 1.02;
      ctx.fillRect(W/2-w/2, y, w, 5*(0.3+t*0.9));
    }

    // lane divider lines (converging)
    ctx.strokeStyle = getCSS('--lane-line');
    ctx.lineWidth = 3;
    for (let i=1;i<LANES;i++){
      ctx.beginPath();
      ctx.moveTo(laneXAt(0,i), horizonY);
      ctx.lineTo(laneXAt(1,i), groundY);
      ctx.stroke();
    }

    // road edges
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(W/2-topW/2, horizonY); ctx.lineTo(W/2-botW/2, groundY);
    ctx.moveTo(W/2+topW/2, horizonY); ctx.lineTo(W/2+botW/2, groundY);
    ctx.stroke();

    // coins (rotating spin + perspective placement)
    for (const c of coins){
      if (c.taken) continue;
      const {scale,y,t} = project(c.z);
      const x = laneXAt(t, c.lane);
      const spin = Math.abs(Math.sin(performance.now()/140 + c.lane));
      const rx = (10*scale) * (0.25 + spin*0.75);
      const ry = 12*scale;
      ctx.fillStyle = '#ffe27a';
      ctx.beginPath();
      ctx.ellipse(x, y-42*scale, rx, ry, 0,0,Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = '#a8790a'; ctx.lineWidth=2; ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.beginPath(); ctx.ellipse(x-rx*0.2, y-42*scale-ry*0.3, rx*0.3, ry*0.25, 0,0,Math.PI*2); ctx.fill();
    }

    // obstacles: 'low' = hazard barricade (jump over), 'high' = train carriage (slide under)
    for (const o of obstacles){
      const {scale,y,t} = project(o.z);
      const x = laneXAt(t, o.lane);
      const w = 54*scale;

      // grounded contact shadow for depth
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath();
      ctx.ellipse(x, y+2*scale, w*0.55, 6*scale, 0,0,Math.PI*2);
      ctx.fill();

      if (o.type==='low'){
        const h = 42*scale;
        const topY = y-h;
        // legs
        ctx.fillStyle = '#2b2b2b';
        ctx.fillRect(x-w/2, topY+h*0.55, 6*scale, h*0.5);
        ctx.fillRect(x+w/2-6*scale, topY+h*0.55, 6*scale, h*0.5);
        // classic red/white hazard board — high contrast, instantly readable
        const bH = h*0.62;
        ctx.save();
        ctx.beginPath();
        ctx.rect(x-w/2, topY, w, bH);
        ctx.clip();
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(x-w/2, topY, w, bH);
        ctx.fillStyle = '#e21f1f';
        const stripeW = 11*scale;
        for (let sx = x-w/2 - bH; sx < x+w/2+bH; sx += stripeW*2){
          ctx.beginPath();
          ctx.moveTo(sx, topY+bH);
          ctx.lineTo(sx+bH, topY);
          ctx.lineTo(sx+bH+stripeW, topY);
          ctx.lineTo(sx+stripeW, topY+bH);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();
        ctx.strokeStyle = '#7a0f0f'; ctx.lineWidth = Math.max(1.5,2*scale);
        ctx.strokeRect(x-w/2, topY, w, bH);
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.fillRect(x-w/2, topY, w, bH*0.16);
        // glowing jump-arrow cue above the barricade
        const arrowY = topY - 14*scale;
        ctx.fillStyle = 'rgba(255,255,255,0.92)';
        ctx.beginPath();
        ctx.moveTo(x, arrowY-9*scale);
        ctx.lineTo(x-8*scale, arrowY+4*scale);
        ctx.lineTo(x+8*scale, arrowY+4*scale);
        ctx.closePath();
        ctx.fill();
      } else {
        // train carriage blocking upper body; clear gap underneath to slide
        const bodyH = 66*scale;
        const gap = 30*scale;
        const bodyTop = y-bodyH-gap;
        const bodyBottom = y-gap;
        const grd = ctx.createLinearGradient(0,bodyTop,0,bodyBottom);
        grd.addColorStop(0, '#e05a5a');
        grd.addColorStop(1, '#9c2f2f');
        ctx.fillStyle = grd;
        ctx.fillRect(x-w/2, bodyTop, w, bodyH);
        // windows strip
        ctx.fillStyle = 'rgba(180,225,255,0.9)';
        ctx.fillRect(x-w*0.4, bodyTop+bodyH*0.22, w*0.8, bodyH*0.3);
        ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth=Math.max(1,1.2*scale);
        ctx.strokeRect(x-w*0.4, bodyTop+bodyH*0.22, w*0.8, bodyH*0.3);
        // underside edge (clearance line) in warning color to show duck-under gap
        ctx.fillStyle = '#ffd54a';
        ctx.fillRect(x-w/2, bodyBottom-3*scale, w, 3*scale);
        ctx.strokeStyle = '#7a1f1f'; ctx.lineWidth = Math.max(1,2*scale);
        ctx.strokeRect(x-w/2, bodyTop, w, bodyH);
        // glowing duck-arrow cue just under the clearance line
        const dArrowY = bodyBottom + 8*scale;
        ctx.fillStyle = 'rgba(255,213,74,0.95)';
        ctx.beginPath();
        ctx.moveTo(x, dArrowY+7*scale);
        ctx.lineTo(x-7*scale, dArrowY-4*scale);
        ctx.lineTo(x+7*scale, dArrowY-4*scale);
        ctx.closePath();
        ctx.fill();
      }
    }

    // speed lines for sense of pace
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 2;
    for (let i=0;i<4;i++){
      const sx = W*0.1 + i*W*0.22;
      const len = 18 + speed*2;
      ctx.beginPath();
      ctx.moveTo(sx, H*0.5 + (i%2)*30);
      ctx.lineTo(sx, H*0.5 + (i%2)*30 + len);
      ctx.stroke();
    }

    // player
    drawPlayer();

    // vignette for depth/realism
    const vg = ctx.createRadialGradient(W/2,H*0.45,H*0.25,W/2,H*0.45,H*0.75);
    vg.addColorStop(0,'rgba(0,0,0,0)');
    vg.addColorStop(1,'rgba(0,0,0,0.28)');
    ctx.fillStyle = vg;
    ctx.fillRect(0,0,W,H);

    // score particles
    ctx.font = 'bold 18px sans-serif';
    ctx.fillStyle = '#ffd54a';
    ctx.textAlign = 'center';
    for (const p of particles){
      ctx.globalAlpha = Math.max(0,p.life/0.4);
      ctx.fillText(p.txt, p.x, p.y);
      ctx.globalAlpha = 1;
    }
  }

  function drawPlayer(){
    const x = player.x;
    const baseY = groundY + player.y; // player.y goes negative when jumping
    const jumping = player.state==='jump';
    const sliding = player.state==='slide';

    // shadow shrinks/fades with jump height
    const liftT = Math.max(0, Math.min(1, -player.y/160));
    ctx.fillStyle = `rgba(0,0,0,${0.28*(1-liftT*0.7)})`;
    ctx.beginPath();
    ctx.ellipse(x, groundY+6, 22*(1-liftT*0.4), 7*(1-liftT*0.4), 0,0,Math.PI*2);
    ctx.fill();

    const swing = Math.sin(player.runFrame);
    const legSwing = jumping ? 0.6 : swing;
    const armSwing = jumping ? -0.8 : -swing;

    if (sliding){
      const h = 30, w = 60;
      const y = baseY - h;
      const ch = CHARACTERS[selectedChar];
      ctx.fillStyle = ch.shirt;
      roundRect(ctx, x-w/2, y, w, h, 12); ctx.fill();
      ctx.fillStyle = ch.skin;
      ctx.beginPath(); ctx.arc(x+w*0.32, y+h*0.4, 12, 0, Math.PI*2); ctx.fill();
      return;
    }

    const ch = CHARACTERS[selectedChar];
    const hipY = baseY - 34;
    const shoulderY = baseY - 62;
    const lean = jumping ? -4 : 3; // slight forward lean while running, upright on jump

    ctx.save();
    ctx.translate(x, hipY);
    ctx.rotate(lean * Math.PI/180);
    ctx.translate(-x, -hipY);

    ctx.strokeStyle = '#2b2f36';
    ctx.lineCap = 'round';

    // back leg
    ctx.lineWidth = 9;
    ctx.strokeStyle = ch.pants;
    ctx.beginPath();
    ctx.moveTo(x, hipY);
    ctx.lineTo(x - legSwing*14, baseY - Math.max(0,legSwing)*6);
    ctx.stroke();
    // back arm
    ctx.strokeStyle = ch.shirtDark;
    ctx.beginPath();
    ctx.moveTo(x, shoulderY);
    ctx.lineTo(x + armSwing*12, shoulderY+22);
    ctx.stroke();

    // torso with shading for volume
    const torsoGrd = ctx.createLinearGradient(x-16, shoulderY, x+16, shoulderY);
    torsoGrd.addColorStop(0, ch.shirt);
    torsoGrd.addColorStop(1, ch.shirtDark);
    ctx.fillStyle = torsoGrd;
    roundRect(ctx, x-16, shoulderY, 32, hipY-shoulderY+10, 10);
    ctx.fill();

    // front leg
    ctx.lineWidth = 10;
    ctx.strokeStyle = ch.pants;
    ctx.beginPath();
    ctx.moveTo(x, hipY);
    ctx.lineTo(x + legSwing*15, baseY - Math.max(0,-legSwing)*6);
    ctx.stroke();
    // front arm
    ctx.lineWidth = 8;
    ctx.strokeStyle = ch.shirt;
    ctx.beginPath();
    ctx.moveTo(x, shoulderY);
    ctx.lineTo(x - armSwing*13, shoulderY+24);
    ctx.stroke();

    // head
    ctx.fillStyle = ch.skin;
    ctx.beginPath();
    ctx.arc(x, shoulderY-12, 14, 0, Math.PI*2);
    ctx.fill();
    // simple face: eye + subtle mouth
    ctx.fillStyle = '#2b2f36';
    ctx.beginPath();
    ctx.arc(x + (jumping?2:4), shoulderY-13, 1.6, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(90,60,40,0.6)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.arc(x+3, shoulderY-8, 3, 0.1*Math.PI, 0.7*Math.PI);
    ctx.stroke();
    // hair/cap
    ctx.fillStyle = ch.hair;
    ctx.beginPath();
    ctx.arc(x, shoulderY-16, 14, Math.PI, 0);
    ctx.fill();
    ctx.restore();
  }

  function drawCharPreview(pctx, ch){
    pctx.clearRect(0,0,70,90);
    const x=35, baseY=78;
    pctx.fillStyle='rgba(0,0,0,0.15)';
    pctx.beginPath(); pctx.ellipse(x,baseY+4,16,4,0,0,Math.PI*2); pctx.fill();
    // legs
    pctx.strokeStyle=ch.pants; pctx.lineWidth=7; pctx.lineCap='round';
    pctx.beginPath(); pctx.moveTo(x,baseY-30); pctx.lineTo(x-8,baseY); pctx.stroke();
    pctx.beginPath(); pctx.moveTo(x,baseY-30); pctx.lineTo(x+8,baseY); pctx.stroke();
    // arms
    pctx.strokeStyle=ch.shirtDark; pctx.lineWidth=6;
    pctx.beginPath(); pctx.moveTo(x,baseY-52); pctx.lineTo(x-11,baseY-32); pctx.stroke();
    pctx.beginPath(); pctx.moveTo(x,baseY-52); pctx.lineTo(x+11,baseY-32); pctx.stroke();
    // torso
    const g = pctx.createLinearGradient(x-13,0,x+13,0);
    g.addColorStop(0,ch.shirt); g.addColorStop(1,ch.shirtDark);
    pctx.fillStyle=g;
    roundRect(pctx, x-13, baseY-52, 26, 26, 8); pctx.fill();
    // head
    pctx.fillStyle=ch.skin;
    pctx.beginPath(); pctx.arc(x, baseY-62, 12, 0, Math.PI*2); pctx.fill();
    pctx.fillStyle=ch.hair;
    pctx.beginPath(); pctx.arc(x, baseY-65, 12, Math.PI, 0); pctx.fill();
  }

  function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function getCSS(name){
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function cloud(x,y,r){
    ctx.beginPath();
    ctx.arc(x, y, r*0.6, 0, Math.PI*2);
    ctx.arc(x+r*0.55, y+r*0.1, r*0.45, 0, Math.PI*2);
    ctx.arc(x-r*0.55, y+r*0.12, r*0.42, 0, Math.PI*2);
    ctx.arc(x+r*0.15, y-r*0.2, r*0.4, 0, Math.PI*2);
    ctx.fill();
  }

  function tree(x,y,s){
    ctx.fillStyle = '#5c3a1e';
    ctx.fillRect(x-s*0.08, y-s*0.5, s*0.16, s*0.5);
    const g = ctx.createRadialGradient(x-s*0.2,y-s*0.9,2,x,y-s*0.7,s*0.9);
    g.addColorStop(0,'#5fae52');
    g.addColorStop(1,'#2f6a2a');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y-s*0.75, s*0.55, 0, Math.PI*2);
    ctx.fill();
  }

  renderHome();
})();
</script>
